<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    
    <!-- Favicon und Icons für mobile Geräte -->
    <link rel="icon" type="image/png" sizes="32x32" href="/green.rocket.com/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/green.rocket.com/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="/green.rocket.com/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/green.rocket.com/apple-touch-icon.png">
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #00BF63;
            display: flex;
            justify-content: flex-start; /* nach oben ausrichten */
            align-items: center;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .center-content {
            text-align: center;
            padding: 1rem;
            width: 100%;
            max-width: 600px;
            position: relative;
            padding-top: 20px; /* steuert den Abstand nach oben */
        }

        .center-content h2,
        .center-content h3 {
            font-size: 1.8rem; /* klein */
            color: black;
            margin: 0;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .button {
            background-color: #00BF63;
            color: black;
            border: 2px solid #00BF63;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
            font-family: Arial, sans-serif;
        }

        .button:hover {
            background-color: #00a452;
        }

        .logo {
            position: relative;
            margin-top: 10px; /* Logo näher an den oberen Rand */
            width: 180px;
            height: auto;
        }

        .wave {
            position: absolute;
            width: 100%;
            height: 150px;
            background: linear-gradient(45deg, #00BF63, #00BF63);
            opacity: 0.5;
            transform: skewY(-3deg);
        }

        .wave.top {
            top: 0;
            transform: skewY(-3deg) translateY(-50%);
        }

        .wave.bottom {
            bottom: 0;
            transform: skewY(3deg) translateY(50%);
        }
    </style>
</head>
<body>
    <div class="wave top"></div>
    <div class="wave bottom"></div>

    <img src="https://raw.githubusercontent.com/GreenRocketOfficial/green.rocket.com/d68cd4626e577291de8be53a613f301cef25b178/Green%20Rocket%20Logo.png" 
         alt="Logo" 
         class="logo">

    <div class="center-content">
        <h2>Bet</h2>
        <h2>Better</h2>
        <h2>Green Rocket</h2>
        
        <div class="button-container">
            <button class="button" onclick="location.href='Tipps abgeben.html'">Tipps abgeben</button>
            <button class="button" onclick="location.href='Divisionsrangliste.html'">Divisionsrangliste</button>
        </div>
    </div>
</body>
</html>
